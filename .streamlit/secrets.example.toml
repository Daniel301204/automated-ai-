# Copy into Community Cloud Advanced settings -> Secrets. Never commit actual values.
database_url = "postgresql+psycopg://USER:PASSWORD@HOST/DATABASE?sslmode=verify-full&sslrootcert=system"
token_encryption_key = "REPLACE_WITH_FERNET_KEY"

[auth]
