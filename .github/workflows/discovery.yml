name: Discover jobs (never sends applications)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
concurrency:
  group: autojob-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scheduled_discovery.py
        env:
          AUTOJOB_DATABASE_URL: ${{ secrets.AUTOJOB_DATABASE_URL }}
